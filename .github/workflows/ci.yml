name: ci

# Pull requests: tests, both Lambda builds, terraform fmt/validate/plan with the
# read-only OIDC role, plan posted as a PR comment. No AWS keys in GitHub.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write        # GitHub OIDC -> debbie-plan-github (read-only)
  pull-requests: write   # plan comment

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-build-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Build Lambda packages (arm64)
        run: python scripts/build_lambda.py all

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.1
          terraform_wrapper: false

      - name: terraform fmt / validate
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra init -input=false
          terraform -chdir=infra validate

      # Fork PRs get no OIDC token, so plan runs only for same-repo branches.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          role-to-assume: arn:aws:iam::484907520476:role/debbie-plan-github
          aws-region: ap-southeast-1

      - name: terraform plan
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -o pipefail
          terraform -chdir=infra plan -input=false -no-color -lock=false 2>&1 | tee plan.txt

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: always() && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('plan.txt') != ''
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['(see log)'])[0];
            const body = `### terraform plan — ${summary}\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

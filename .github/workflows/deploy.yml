name: deploy

# main: tests -> arm64 builds -> (manual approval: `production` environment) ->
# terraform apply via OIDC -> release gate (smoke-test the new Lambda version
# directly, then move the `live` alias) -> public smoke test.
# A version that fails the gate never receives traffic; `live` stays put.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment: production   # required reviewer; the deploy role trusts only this environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Build Lambda packages (arm64)
        run: python scripts/build_lambda.py all

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.1
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::484907520476:role/debbie-deploy-github
          aws-region: ap-southeast-1

      - name: terraform apply
        run: |
          terraform -chdir=infra init -input=false
          terraform -chdir=infra apply -input=false -auto-approve

      - name: Release gate (smoke-test new version, then move `live`)
        run: python scripts/release.py

      - name: Public smoke test
        run: |
          url="$(terraform -chdir=infra output -raw api_url)"
          curl -sf "$url/api/v1/health" | tee /dev/stderr | grep -q '"status":"healthy"'
